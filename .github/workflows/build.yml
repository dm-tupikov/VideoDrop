name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check command arguments
        run: python scripts/test.py
      - name: Download verified dependencies
        run: python scripts/fetch_deps.py
      - name: Build portable executable
        run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: VideoDrop-Windows-x64
          path: dist/*
